name: ci
on:
  push:
    branches: [build, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  responsive:
    # Every page at 360 / 390 / 414 / 768 / 1024 (portrait + landscape), 1280, 1440, 1920:
    # fails on horizontal overflow, off-screen text and tap targets under 44 px on touch screens.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
        env: { CI: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: test-results/responsive
          retention-days: 14
