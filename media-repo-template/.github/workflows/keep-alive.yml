name: keep-alive
on:
  schedule:
    - cron: "23 6 */3 * *" # every 3 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: One tiny read from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          code=$(curl -s -o /tmp/ping.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $code"
          echo "{\"keep_alive_at\":\"$(date -u +%FT%TZ)\",\"supabase_http\":$code}" > status.json
          test "$code" -lt 500
      # Committing also counts as repo activity, so GitHub never disables the scheduled workflows.
      - name: Record status
        if: always()
        run: |
          git add status.json
          git -c user.name=xperience-keepalive -c user.email=actions@users.noreply.github.com commit -qm "status: keep-alive" || true
          git push -q || true
